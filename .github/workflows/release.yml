name: Release desktop

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

# The runtime installers look up pinned releases through the GitHub API. Unauthenticated, that lookup
# shares the hosted runner's 60-requests-an-hour address limit with every other job on the machine and
# fails with 403 when it runs out; the job token raises it to the repository's own limit. Build main
# does the same.
env:
  GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    # Gating the one job every build and the publish depend on keeps a manual run off the release
    # path entirely, rather than relying on each of them to opt out.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.release.outputs.version }}
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require release commit on main
        shell: bash
        run: |
          git fetch origin main --no-tags
          release_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "Release tag $GITHUB_REF_NAME does not point to a commit on origin/main." >&2
            exit 1
          fi

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: none

      - name: Validate release version
        id: release
        shell: bash
        run: |
          package_version="$(bun -p 'require("./package.json").version')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version." >&2
            exit 1
          fi
          grep -F "## [$package_version]" CHANGELOG.md
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$package_version" >> "$GITHUB_OUTPUT"

      # The release page shows the plain-language changelog entry, not a list of commit titles.
      - name: Extract release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          awk -v heading="## [$RELEASE_VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no notes under ## [$RELEASE_VERSION]." >&2
            exit 1
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # Dani-Dex ships one unsigned universal Mac app, so an Intel Mac and an Apple silicon Mac download
  # the same DMG and read the same latest-mac.yml. Without a Developer ID signature Squirrel.Mac
  # cannot install in place, so the app installs this release's ZIP itself (mac-bundle-updater.ts).
  macos:
    name: Build unsigned universal macOS release
    needs: validate
    runs-on: macos-14
    timeout-minutes: 90
    environment: release
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Run macOS checks
        run: bun run lint && bun run typecheck && bunx vitest run src/backend/cli.test.ts

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Both Hermes trees are staged on this arm64 runner: uv installs the x64 wheels by platform, and
      # only the arm64 tree can be started here.
      - name: Install and verify runtimes
        run: |
          bun run install:codex-runtime
          bun run install:claude-runtime
          bun run install:grok-runtime
          bun scripts/install-hermes-runtime.ts darwin arm64
          bun scripts/install-hermes-runtime.ts darwin x64
          bun run install:remote-desktop-runtime
          bun run verify:remote-desktop-runtime
          bun run prepare:cua-driver

      - name: Stage pinned Dani Free resources for both Mac slices
        run: |
          bun scripts/stage-dani-free-release.ts darwin arm64
          bun scripts/stage-dani-free-release.ts darwin x64

      - name: Build unsigned universal DMG and ZIP
        run: |
          bun run voice:prepare-runtime
          bun run build
          bun run dist:mac:universal

      - name: Verify both slices and packaged Hermes
        run: |
          set -euo pipefail
          app=dist/mac-universal/Dani-Dex.app
          archs=$(lipo -archs "$app/Contents/MacOS/Dani-Dex")
          echo "Main executable: $archs"
          grep -qw arm64 <<<"$archs"
          grep -qw x86_64 <<<"$archs"
          # Both Hermes trees are started, the Intel one under Rosetta: `--version` and an ACP
          # handshake, each in a time budget, on the tree exactly as packaged.
          /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license
          bun scripts/verify-packaged-hermes.ts "$app/Contents/Resources/hermes/mac/arm64" arm64
          bun scripts/verify-packaged-hermes.ts "$app/Contents/Resources/hermes/mac/x64" x86_64
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$RELEASE_VERSION"

      - name: Verify the packaged Computer Use driver
        # Present, pinned, universal (Intel Macs run it too), vendor signature intact, and `serve`
        # answers with its tools. A release never ships a missing or broken driver again.
        run: bun scripts/verify-cua-driver-package.ts dist/mac-universal/Dani-Dex.app/Contents/Resources darwin-arm64

      - name: Verify packaged Dani Free in both Mac slices
        run: |
          bun scripts/smoke-packaged-dani-free.ts dist/mac-universal/Dani-Dex.app/Contents/Resources darwin arm64
          bun scripts/smoke-packaged-dani-free.ts dist/mac-universal/Dani-Dex.app/Contents/Resources darwin x64

      - name: Verify updater metadata
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          zips=(dist/*.zip)
          if (( ${#dmgs[@]} != 1 || ${#zips[@]} != 1 )) || [ ! -f dist/latest-mac.yml ]; then
            echo "Expected one DMG, one ZIP, and latest-mac.yml." >&2
            find dist -maxdepth 1 -type f -print
            exit 1
          fi
          grep -F "version: $RELEASE_VERSION" dist/latest-mac.yml
          grep -F '.zip' dist/latest-mac.yml
          bun run verify:update-artifacts macos

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 ./*.dmg ./*.zip | sed 's| \./| |' > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt

      - name: Generate macOS release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist/mac-universal/Dani-Dex.app
          format: spdx-json
          output-file: dist/Dani-Dex-${{ env.RELEASE_VERSION }}-macos.spdx.json
          artifact-name: Dani-Dex-${{ env.RELEASE_VERSION }}-macOS-SBOM
          upload-artifact: false
          upload-release-assets: false

      - name: Attest macOS release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS-macos.txt

      - name: Upload macOS release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
            dist/*.spdx.json
            dist/SHA256SUMS-macos.txt
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build unsigned Windows x64 release
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 35
    environment: release
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Run Windows checks
        run: bun run lint && bun run typecheck && bunx vitest run src/backend/cli.test.ts

      - name: Install and verify remote desktop runtime
        run: bun scripts/install-remote-desktop-runtime.ts win32 x64 && bun run verify:remote-desktop-runtime --windows

      # Hermes is staged with uv from a hash-locked requirements file.
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install and verify provider control artifacts
        run: |
          bun scripts/install-codex-runtime.ts win32 x64
          bun scripts/install-claude-runtime.ts win32 x64
          bun scripts/install-grok-runtime.ts win32 x64
          bun scripts/install-hermes-runtime.ts win32 x64

      - name: Stage pinned Dani Free resources
        run: bun scripts/stage-dani-free-release.ts win32 x64

      - name: Build unsigned NSIS installer
        run: bun run dist:win

      - name: Verify packaged application metadata and launch
        run: bun run verify:package:win --require-update-metadata

      - name: Verify the packaged Computer Use driver
        run: bun scripts/verify-cua-driver-package.ts dist/win-unpacked/resources win32-x64

      - name: Verify packaged Hermes starts
        run: bun scripts/verify-packaged-hermes.ts dist/win-unpacked/resources/hermes/win/x64

      - name: Verify packaged Dani Free
        run: bun scripts/smoke-packaged-dani-free.ts dist/win-unpacked/resources win32 x64

      - name: Verify installer and updater metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(Get-ChildItem -Path dist -File -Filter *.exe)
          if ($installers.Count -ne 1 -or -not (Test-Path dist/latest.yml)) {
            Write-Error "Expected one EXE installer and latest.yml."
          }
          $applicationSignature = Get-AuthenticodeSignature -LiteralPath dist/win-unpacked/Dani-Dex.exe
          if ($applicationSignature.Status -ne "NotSigned") {
            Write-Error "The unsigned application contract changed: $($applicationSignature.Status)."
          }
          $sourceBuiltRuntimeExecutables = @(
            "dist/win-unpacked/resources/remote-desktop-runtime/win32/x64/sunshine.exe",
            "dist/win-unpacked/resources/remote-desktop-runtime/win32/x64/web-server.exe",
            "dist/win-unpacked/resources/remote-desktop-runtime/win32/x64/streamer.exe"
          )
          $vendorRuntimeExecutables = @(
            "build/codex/win/x64/bin/codex.exe",
            "build/codex/win/x64/bin/codex-code-mode-host.exe",
            "build/claude/win/x64/bin/claude.exe",
            "build/grok/win/x64/bin/grok.exe"
          )
          foreach ($runtimeExecutable in $sourceBuiltRuntimeExecutables) {
            $runtimeSignature = Get-AuthenticodeSignature -LiteralPath $runtimeExecutable
            if ($runtimeSignature.Status -ne "NotSigned") {
              Write-Error "The source-built runtime signature contract changed for ${runtimeExecutable}: $($runtimeSignature.Status)."
            }
          }
          foreach ($runtimeExecutable in $vendorRuntimeExecutables) {
            $runtimeSignature = Get-AuthenticodeSignature -LiteralPath $runtimeExecutable
            if ($runtimeSignature.Status -ne "Valid") {
              Write-Error "The vendor runtime signature is not valid for ${runtimeExecutable}: $($runtimeSignature.Status)."
            }
          }
          $providerVendorPatterns = @{
            "build/codex/win/x64/bin/codex.exe" = "OpenAI"
            "build/codex/win/x64/bin/codex-code-mode-host.exe" = "OpenAI"
            "build/claude/win/x64/bin/claude.exe" = "Anthropic"
            "build/grok/win/x64/bin/grok.exe" = "X\.AI|xAI"
          }
          foreach ($runtimeExecutable in $providerVendorPatterns.Keys) {
            $runtimeSignature = Get-AuthenticodeSignature -LiteralPath $runtimeExecutable
            if ($runtimeSignature.SignerCertificate.Subject -notmatch $providerVendorPatterns[$runtimeExecutable]) {
              Write-Error "The provider runtime has an unexpected signer: ${runtimeExecutable}."
            }
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installers[0].FullName
          if ($signature.Status -ne "NotSigned") {
            Write-Error "The unsigned installer contract changed: $($signature.Status)."
          }
          Select-String -Path dist/latest.yml -SimpleMatch "version: $env:RELEASE_VERSION"
          Select-String -Path dist/latest.yml -SimpleMatch ".exe"
          bun run verify:update-artifacts windows

      - name: Generate checksums
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem -Path dist -File -Filter *.exe)
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer[0].FullName).Hash.ToLowerInvariant()
          "$hash  $($installer[0].Name)" | Set-Content -Encoding ascii dist/SHA256SUMS-windows.txt

      - name: Generate Windows release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist/win-unpacked
          format: spdx-json
          output-file: dist/Dani-Dex-${{ env.RELEASE_VERSION }}-windows.spdx.json
          artifact-name: Dani-Dex-${{ env.RELEASE_VERSION }}-Windows-SBOM
          upload-artifact: false
          upload-release-assets: false

      - name: Attest Windows release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS-windows.txt

      - name: Upload Windows release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/*.spdx.json
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Build unsigned Linux x64 release
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: release
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Install a virtual display for the launch check
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes xvfb

      - name: Run Linux checks
        run: bun run lint && bun run typecheck && bunx vitest run src/backend/cli.test.ts

      # Hermes is staged with uv from a hash-locked requirements file.
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install and verify provider control artifacts
        run: |
          bun scripts/install-codex-runtime.ts linux x64
          bun scripts/install-claude-runtime.ts linux x64
          bun scripts/install-grok-runtime.ts linux x64
          bun scripts/install-hermes-runtime.ts linux x64

      - name: Stage pinned Dani Free resources
        run: bun scripts/stage-dani-free-release.ts linux x64

      - name: Build AppImage
        run: bun run dist:linux

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, which is the same
      # restriction the shipped profile answers for an installed AppImage. The verifier starts the
      # unpacked build from the workspace, so that path needs its own profile, and the SUID helper
      # needs the ownership a package manager would give it. The sandbox stays on either way:
      # `--no-sandbox` would make the launch check prove nothing about a real install.
      - name: Permit the Electron sandbox for the verification build
        run: |
          set -euo pipefail
          sudo chown root:root dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/linux-unpacked/chrome-sandbox
          sudo tee /etc/apparmor.d/dani-dex-verify >/dev/null <<PROFILE
          abi <abi/4.0>,
          include <tunables/global>

          profile dani-dex-verify "$GITHUB_WORKSPACE/dist/linux-unpacked/dani-dex" flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/dani-dex-verify

      - name: Verify packaged application metadata and launch
        run: xvfb-run -a bun run verify:package:linux --require-update-metadata

      - name: Verify packaged Dani Free
        run: bun scripts/smoke-packaged-dani-free.ts dist/linux-unpacked/resources linux x64

      - name: Verify AppImage and updater metadata
        run: |
          set -euo pipefail
          shopt -s nullglob
          appImages=(dist/*.AppImage)
          if [ "${#appImages[@]}" -ne 1 ] || [ ! -f dist/latest-linux.yml ]; then
            echo "Expected one AppImage and latest-linux.yml." >&2
            exit 1
          fi
          # The AppImage has to stay executable, or the download is unusable without a chmod.
          if [ ! -x "${appImages[0]}" ]; then
            echo "The AppImage is not executable." >&2
            exit 1
          fi
          grep -Fq "version: $RELEASE_VERSION" dist/latest-linux.yml
          grep -Fq ".AppImage" dist/latest-linux.yml
          bun run verify:update-artifacts linux

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 ./*.AppImage | sed 's| \./| |' > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      - name: Generate Linux release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist/linux-unpacked
          format: spdx-json
          output-file: dist/Dani-Dex-${{ env.RELEASE_VERSION }}-linux.spdx.json
          artifact-name: Dani-Dex-${{ env.RELEASE_VERSION }}-Linux-SBOM
          upload-artifact: false
          upload-release-assets: false

      - name: Attest Linux release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS-linux.txt

      - name: Upload Linux release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          # An AppImage embeds its block map, so there is no sidecar file to upload beside it.
          path: |
            dist/*.AppImage
            dist/latest-linux.yml
            dist/*.spdx.json
            dist/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [validate, macos, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
    steps:
      - name: Download macOS release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos
          path: release-assets/macos

      - name: Download Windows release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-windows
          path: release-assets/windows

      - name: Download Linux release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux
          path: release-assets/linux

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: release-notes

      - name: Generate combined checksums
        shell: bash
        run: |
          cat release-assets/macos/SHA256SUMS-macos.txt \
            release-assets/windows/SHA256SUMS-windows.txt \
            release-assets/linux/SHA256SUMS-linux.txt \
            > release-assets/SHA256SUMS.txt

      # The README's download buttons link to releases/latest/download/<name>, which only keeps
      # working across versions if the name has no version in it. These are byte-for-byte copies of
      # the versioned installers; the updater keeps reading the versioned files through latest*.yml.
      - name: Add fixed download names
        shell: bash
        run: |
          set -euo pipefail
          add_copy() {
            local pattern="$1" name="$2"
            local matches=($pattern)
            if [ "${#matches[@]}" -ne 1 ] || [ ! -f "${matches[0]}" ]; then
              echo "Expected exactly one file for $pattern." >&2
              exit 1
            fi
            cp "${matches[0]}" "release-assets/$name"
          }
          add_copy "release-assets/macos/*-universal.dmg" Dani-Dex-mac-universal.dmg
          add_copy "release-assets/windows/*-x64.exe" Dani-Dex-windows-x64.exe
          add_copy "release-assets/linux/*-x86_64.AppImage" Dani-Dex-linux-x86_64.AppImage
          chmod +x release-assets/Dani-Dex-linux-x86_64.AppImage

      - name: Publish GitHub Release
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(release-assets/macos/* release-assets/windows/* release-assets/linux/* release-assets/SHA256SUMS.txt release-assets/Dani-Dex-*)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${artifacts[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file release-notes/release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              "${artifacts[@]}" \
              --notes-file release-notes/release-notes.md \
              --latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Dani-Dex $RELEASE_TAG"
          fi

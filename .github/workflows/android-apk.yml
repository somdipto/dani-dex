name: Android test APK

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/android-apk.yml'
      - '.github/actions/setup-bun/**'
      - '.nvmrc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      APK_ABIS: arm64-v8a,x86_64
      GRADLE_OPTS: '-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ runner.os }}-jdk17-ndk27.1-${{ hashFiles('bun.lock', 'apps/mobile/app.json', 'apps/mobile/package.json') }}
      - name: Install exact native toolchain
        run: |
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Install mobile native libraries
        run: bun run --cwd apps/mobile setup:skia
      - name: Focused robot regression
        run: node node_modules/vitest/vitest.mjs run apps/mobile/src/features/agents/model/robot-appearance.node.test.ts --maxWorkers=1
      - name: Build standalone test APK
        working-directory: apps/mobile
        run: bun run android:apk:local
      - name: Check APK identity, signature and bundle
        run: |
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | tee apk-badging.txt
          grep -q "package: name='dev.danlab.danidex.mobile'" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee apk-signature.txt
          unzip -l "$apk" | grep 'assets/index.android.bundle'
          sha256sum "$apk" | tee apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dani-dex-test-apk-${{ github.sha }}
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apk-badging.txt
            apk-signature.txt
            apk-sha256.txt
          retention-days: 7
          if-no-files-found: error
